palette = "catppuccin_mocha"
add_newline = false
format = """
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$c\
$python\
$lua\
$golang\
$rust\
$cmd_duration\
$status\
$character"""

[git_status]
format = "[[$conflicted](yellow)[$untracked](peach)[$modified$renamed](white)[$staged](green)[$deleted](red)($ahead_behind$stashed)]($style)"
conflicted = " $count "
untracked  = " $count "
modified   = " $count "
deleted    = " $count "
staged     = " $count "
renamed    = " $count "
stashed    = " $count "
style      = "cyan"

[git_metrics]
disabled = true

[line_break]
disabled = true

[directory]
truncation_length       = 3
truncate_to_repo        = true
fish_style_pwd_dir_length = 1
read_only               = " 󰌾"

[hostname]
ssh_symbol = " "

[git_branch]
symbol = " "

[git_commit]
tag_symbol = ' '

[c]
symbol = " "

[python]
symbol = " "

[lua]
symbol = " "

[golang]
symbol = " "

[rust]
symbol = "󱘗 "

[cmd_duration]
min_time = 2_000
format   = "[ $duration]($style) "
style    = "yellow"

[status]
disabled = false
format   = "[$symbol$status]($style) "
symbol   = " "
style    = "red"

[gcloud]
disabled = true

[username]
disabled = true

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
