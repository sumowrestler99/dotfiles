# =============================================================================
# General
# =============================================================================

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc'   # true color passthrough
set -as terminal-overrides ',xterm*:sitm=\E[3m'  # italics passthrough

set -g history-limit 50000
set -s escape-time 0                      # no delay for escape key
set -g focus-events on                    # pass focus events to apps (nvim)
set -g mouse on

set -g base-index 1                       # start window numbering at 1
setw -g pane-base-index 1                 # start pane numbering at 1
set -g renumber-windows on               # renumber when window is closed
set -g set-titles on                      # set terminal title

# =============================================================================
# Prefix
# =============================================================================

set -g prefix C-b
bind C-b send-prefix                      # press C-b twice to send it to app

# =============================================================================
# Key bindings
# =============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf reloaded'

# Split panes using | and -  (and keep current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeping current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Move windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Zoom pane
bind z resize-pane -Z

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# =============================================================================
# Copy mode (vi-style)
# =============================================================================

setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# =============================================================================
# Status bar
# =============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"  # catppuccin mocha

# Left: session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right: host, date, time
set -g status-right-length 80
set -g status-right "#[fg=#6c7086]│ #[fg=#a6e3a1]#H #[fg=#6c7086]│ #[fg=#cdd6f4]%a %d %b #[fg=#6c7086]│ #[fg=#cdd6f4,bold]%H:%M "

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "
set -g window-status-style "fg=#6c7086"
set -g window-status-current-style "fg=#89b4fa"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#313244,fg=#cdd6f4"

# =============================================================================
# Activity
# =============================================================================

set -g monitor-activity on
set -g visual-activity off
